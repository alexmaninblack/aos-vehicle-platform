# The same pinned Linux/Aos base, a different explicit image/model/target.
# No network, Main build selector change or VDP bootstrap installation.
require factory-42.conf
AOS_ROOTFS_IMAGE_VERSION:forcevariable = "6.1.1-vision-camera.1"
AOS_BASE_IMAGE:forcevariable = "aos-image-vision"
IMAGE_BASENAME:forcevariable = "aos-image-vision"
AOS_UNIT_MODEL:forcevariable = "aos-vision-vm"
AOS_UNIT_VERSION:forcevariable = "1.0.0"
AOS_NODE_TYPE:forcevariable = "aos-vision-vm-main"
AOS_COMPONENT_RUNTIME_PREFIX:forcevariable = "aos-vision-vm-1.0.0-main-qemuarm64-"
