[Service]
# Existing SM lifecycle owns recovery. Missing/in-flight VDP data is deferred
# by the projector, not a reason to block SM or manufacture placeholder input.
ExecStartPre=/usr/bin/python3 -B /usr/libexec/aos-demo-service-inputs.py cold
ExecStartPost=/usr/bin/python3 -B /usr/libexec/aos-demo-service-inputs.py verify
