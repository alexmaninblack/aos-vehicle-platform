[Unit]
PartOf=aos-kuksa-substrate.target
Requires=aos-kuksa-verifier-prepare.service
After=aos-kuksa-verifier-prepare.service
ConditionPathExists=/var/aos/.provisionstate
ConditionPathExists=/run/aos-kuksa-verifier/kuksa-jwt-public.pem

[Service]
EnvironmentFile=
Environment="EXTRA_ARGS=--vss /usr/share/vss/vss.json --tls-cert /etc/kuksa-val/Server.pem --tls-private-key /etc/kuksa-val/Server.key --jwt-public-key=/run/aos-kuksa-verifier/kuksa-jwt-public.pem --address=0.0.0.0"
