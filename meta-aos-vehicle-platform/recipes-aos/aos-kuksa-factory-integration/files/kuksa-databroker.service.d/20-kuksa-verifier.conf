[Unit]
PartOf=aos-kuksa-substrate.target
Requires=aos-kuksa-tls-prepare.service aos-kuksa-verifier-prepare.service
After=aos-kuksa-tls-prepare.service aos-kuksa-verifier-prepare.service
ConditionPathExists=/var/aos/.provisionstate
ConditionPathExists=/run/aos-kuksa-verifier/kuksa-jwt-public.pem
ConditionPathExists=/var/lib/aos-kuksa-tls/server.key
ConditionPathExists=/var/lib/aos-kuksa-tls/server.pem

[Service]
EnvironmentFile=
LoadCredential=kuksa-server-key:/var/lib/aos-kuksa-tls/server.key
LoadCredential=kuksa-server-cert:/var/lib/aos-kuksa-tls/server.pem
ExecStart=
ExecStart=/usr/bin/databroker --vss /usr/share/vss/vss.json --tls-cert %d/kuksa-server-cert --tls-private-key %d/kuksa-server-key --jwt-public-key=/run/aos-kuksa-verifier/kuksa-jwt-public.pem --address=0.0.0.0
