[Unit]
PartOf=aos-kuksa-substrate.target
Requires=aos-kuksa-provider-prepare.service kuksa-databroker.service
After=aos-kuksa-provider-prepare.service kuksa-databroker.service
ConditionPathExists=/var/lib/aos-kuksa-provider/kuksa-token

[Service]
# Replace the inherited VDP-store source. systemd snapshots the credential into
# the service-private credential directory; the VDP process never reads this
# root-owned source directory.
LoadCredential=
LoadCredential=kuksa-token:/var/lib/aos-kuksa-provider/kuksa-token
