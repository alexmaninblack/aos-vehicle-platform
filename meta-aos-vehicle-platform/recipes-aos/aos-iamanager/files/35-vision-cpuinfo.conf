[Service]
# Preserve actual Linux/sysfs records and project their verified four-vCPU
# topology before the existing IAM owner reads it. No new daemon/quota owner.
ExecStartPre=/usr/bin/python3 -I -B /usr/libexec/aos-vision-cpuinfo.py --write-profile
