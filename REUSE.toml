version = 1
SPDX-PackageName = "Aos Vehicle Platform"
SPDX-PackageSupplier = "Person: maninblack"
SPDX-PackageDownloadLocation = "https://github.com/alexmaninblack/aos-vehicle-platform"

[[annotations]]
path = ["LICENSE", "NOTICE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 maninblack"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "DEPENDENCIES.json",
    "contracts/vehicle-telemetry-profile/contract.schema.json",
    "contracts/vehicle-telemetry-profile/v0.1/profile.json",
    "contracts/vehicle-telemetry-profile/v0.1.1/profile.json",
    "meta-aos-vehicle-platform/recipes-aos/aos-servicemanager/files/sm.cfg",
    "meta-aos-vehicle-platform/recipes-aos/aos-servicemanager/files/resources.cfg",
    "meta-aos-vehicle-platform/recipes-aos/aos-servicemanager/files/resources-demo-services.cfg",
    "manifests/release-candidates/*.manifest.json",
    "providers/carla-viss-kuksa/releases/*/capability-manifest.json",
    "providers/carla-viss-kuksa/releases/*/provider.json",
    "packaging/fota/config.yaml",
    "providers/carla-viss-kuksa/config/component.json",
    "providers/carla-viss-kuksa/config/vehicle-integration.example.json",
]
